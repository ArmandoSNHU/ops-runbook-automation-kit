name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover
      - name: Validate sample runbook
        run: python -m runbook_kit validate examples/sample_runbook.json
      - name: Run sample runbook
        run: python -m runbook_kit run examples/sample_runbook.json --pretty

